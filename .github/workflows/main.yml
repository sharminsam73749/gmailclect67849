name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Script
        run: wget https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/test.js
      - run: wget -O founder.js https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/founder2.js

      - name: Install package
        run: npm install ws puppeteer-extra-plugin-stealth puppeteer-extra puppeteer@19.10.0 tough-cookie got@11.8.6
        
      - name: Run Script
        run: node test.js "$KEY" "$IV"
        env:
          KEY: ${{ secrets.KEY }}
          IV: ${{ secrets.IV }}
